name: Deploy eBook to GitHub Pages

on:
  push:
    branches:
      - main        # main branch-এ push হলে auto deploy হবে
  workflow_dispatch: # manual trigger-ও করা যাবে

# GitHub Pages-এর জন্য permission
permissions:
  contents: read
  pages: write
  id-token: write

# একটির বেশি deploy একসাথে চলবে না
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # root folder upload করবে (index.html সহ সব files)
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
